<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">

</head>

    <nav class="nav-links">
      <a href="#/films">Films</a>

      <a href="#/academy">Cinematography</a>
      <a href="#/about">About</a>
    </nav>

</header>
<main></main>

<script src="js/academy-full.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  // Safety net: ensure app initializes even if app.js DOMContentLoaded handler fails
  (function() {
    var debugDiv = document.createElement('div');
    debugDiv.style.cssText = 'position:fixed;bottom:10px;right:10px;padding:10px;background:#000;color:#0f0;font:12px monospace;z-index:9999;border-radius:4px;max-width:300px;';
    debugDiv.id = 'debug-info';
    document.body.appendChild(debugDiv);
    function log(msg) {
      var d = document.getElementById('debug-info');
      if (d) d.textContent += '\n' + msg;
      console.log(msg);
    }
    function tryInit() {
      log('init: readyState=' + document.readyState);
      try {
        log('init: renderPage=' + typeof renderPage);
        log('init: FILM_DATA=' + typeof FILM_DATA);
        log('init: lang=' + typeof lang);
        log('init: DIRECTOR_DATA=' + typeof DIRECTOR_DATA);
        if (typeof renderPage === 'function') {
          log('init: calling renderPage()');
          renderPage();
        } else {
          log('ERROR: renderPage not available');
        }
      } catch (e) {
        log('Init ERROR: ' + e.message);
        var main = document.querySelector('main');
        if (main && !main.innerHTML.trim()) {
          main.innerHTML = '<div style="padding:40px;text-align:center;color:#666">Loading&hellip; Error: ' + e.message + '. Please refresh.</div>';
        }
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', tryInit);
    } else {
      tryInit();
    }
    window.addEventListener('error', function(e) {
      log('UNHANDLED ERROR: ' + (e.error?.message || e.message));
    });
    window.addEventListener('unhandledrejection', function(e) {
      log('UNHANDLED REJECTION: ' + e.reason);
    });
  })();
</script>
</body>
</html>
