<script>
  // Safety net: ensure app initializes even if app.js DOMContentLoaded handler fails
  (function() {
    function tryInit() {
      try {
        if (typeof renderPage === 'function') {
          renderPage();
        } else if (typeof appInit === 'function') {
          appInit();
        }
      } catch (e) {
        console.error('Init error:', e);
        // Fallback: show basic content
        var main = document.querySelector('main');
        if (main && !main.innerHTML.trim()) {
          main.innerHTML = '<div style="padding:40px;text-align:center;color:#666">Loading&hellip; If this persists, please refresh.</div>';
        }
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', tryInit);
    } else {
      tryInit();
    }
    // Also catch any unhandled errors
    window.addEventListener('error', function(e) {
      console.error('Unhandled error:', e.error || e.message);
    });
  })();
</script>
</body>
</html>
